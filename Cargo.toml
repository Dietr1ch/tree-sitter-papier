[package]
name = "tree-sitter-papier"
description = "A strict, simple recursive document language"
version = "0.1.0"
authors = ["Dietrich Daroch <Dietrich@Daroch.me>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "papier"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://papier-lang.github.io/papier"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
